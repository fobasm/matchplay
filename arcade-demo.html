<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Arcade test</title>
<link rel="stylesheet" href="arcade.css">
<style>html,body{margin:0;height:100%;background:#111}#stage{width:100vw;height:100vh}</style>
</head>
<body>
<div id="stage"></div>
<script src="arcade.js"></script>
<script>
  window.__engine = MzansiArcade.start(document.getElementById('stage'), {
    homeName: 'Bright PMB', awayName: 'Soweto Kings',
    onGoal: s => { window.__lastGoal = s; },
    onFinalWhistle: s => { window.__final = s; }
  });
</script>
</body>
</html>
